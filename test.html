<!doctype html>
<meta charset="utf-8">
<title>WAIT</title>
<script>history.replaceState(null, "", "/");</script>

<div id="suggested" aria-posinset="1"><span>Suggested for you</span></div>
<div id="normal" aria-posinset="2">
  <div data-ad-rendering-role="story_message"><span>Suggested for you</span></div>
</div>
<div id="group" aria-posinset="3"><h4><div role="button"><span>Join</span></div></h4></div>
<div id="page" aria-posinset="4"><h4><div role="button"><span>Follow</span></div></h4></div>
<div id="body-button" aria-posinset="5"><div role="button"><span>Follow</span></div></div>
<div id="right-rail">
  <h3>Sponsored&#x200b;</h3>
  <div><button aria-label="Open menu for Acme sponsored content"></button></div>
</div>
<div id="ordinary-section"><h3>Sponsored</h3></div>
<div id="late-child" aria-posinset="8">
  <h4><div role="button"><span></span></div></h4>
</div>
<div id="late-character" aria-posinset="9">
  <h4><div role="button"><span>Pending</span></div></h4>
</div>

<script src="/content.js"></script>
<script>
  const offHomepage = document.createElement("div");
  offHomepage.setAttribute("aria-posinset", "6");
  offHomepage.innerHTML = '<h4><div role="button"><span>Join</span></div></h4>';
  // Keep this detached so the homepage observer cannot reclassify it.
  hideFeedPosts(offHomepage, "/groups/example");

  const dynamic = document.createElement("div");
  dynamic.id = "dynamic";
  dynamic.setAttribute("aria-posinset", "7");
  dynamic.innerHTML = "<span>Suggested for you</span>";
  document.body.append(dynamic);

  setTimeout(() => {
    document.querySelector("#late-child span").textContent = "Follow";
    document.querySelector("#late-character span").firstChild.data = "Join";

    setTimeout(() => {
      const expected = {
        suggested: true, normal: false, group: true, page: true,
        "body-button": false, "right-rail": true, "ordinary-section": false,
        dynamic: true, "late-child": true, "late-character": true,
      };
      const failures = Object.entries(expected)
        .filter(([id, hidden]) => document.getElementById(id).classList.contains("fb-ad-blocker-hidden") !== hidden)
        .map(([id]) => id);
      if (offHomepage.classList.contains("fb-ad-blocker-hidden")) failures.push("off-homepage");

      document.documentElement.dataset.result = failures.length ? "fail" : "pass";
      document.title = failures.length ? `FAIL: ${failures.join(", ")}` : "PASS";
      if (failures.length) throw new Error(document.title);
    });
  });
</script>
